name: rust

# Rust service: pinned toolchain (rust-toolchain.toml), cargo fmt --check,
# clippy -D warnings, cargo-nextest (+ doctests), cargo-deny (advisories,
# bans, licenses, sources) + cargo-audit + Trivy fs on Cargo.lock, CodeQL
# (rust), then container.yaml: static musl binary per arch on native runners
# into distroless/static, scan, SBOM, provenance, keyless cosign. Build cache:
# Swatinem/rust-cache (registry + target, keyed on toolchain and Cargo.lock).
# Expects a Dockerfile like templates/dockerfiles/rust.Dockerfile.
#
# Required caller permissions:
#   contents: read, actions: read, packages: write, id-token: write,
#   attestations: write, security-events: write
# Bump the OpenChoreo Workload afterwards with workload-bump.yaml.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Crate / workspace directory (Cargo.toml, Cargo.lock, rust-toolchain.toml)'
        required: false
        type: string
        default: '.'
      run_fmt:
        description: 'Run cargo fmt --check'
        required: false
        type: boolean
        default: true
      run_clippy:
        description: 'Run cargo clippy (warnings are errors)'
        required: false
        type: boolean
        default: true
      clippy_args:
        description: 'cargo clippy arguments'
        required: false
        type: string
        default: '--all-targets --all-features --locked -- -D warnings'
      test_args:
        description: 'cargo nextest / cargo test arguments'
        required: false
        type: string
        default: '--workspace --all-features --locked'
      run_deny:
        description: 'Run cargo-deny (licenses only with a deny.toml)'
        required: false
        type: boolean
        default: true
      run_audit:
        description: 'Run cargo-audit'
        required: false
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL (rust)'
        required: false
        type: boolean
        default: true
      build_container:
        description: 'Build/scan/sign the container image after checks'
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry prefix (default ghcr.io/<owner>)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context (default working_directory)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Dockerfile (default <working_directory>/Dockerfile)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated image platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      multiarch_strategy:
        description: 'native (per-arch runners) or qemu'
        required: false
        type: string
        default: 'native'
      build_args:
        description: 'Newline-separated extra build-args'
        required: false
        type: string
        default: ''
      push:
        description: 'Push, attest and sign on non-PR events'
        required: false
        type: boolean
        default: true
      trivy_severity:
        description: 'Severities that fail the Trivy scans (image and lockfiles)'
        required: false
        type: string
        default: 'CRITICAL'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      trivy_ignore_file:
        description: 'Repo-relative .trivyignore(.yaml) with accepted risks'
        required: false
        type: string
        default: ''
      trivy_fail:
        description: 'Fail on Trivy findings at trivy_severity'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Registry username (non-GHCR registries)'
        required: false
      registry_password:
        description: 'Registry password/token (non-GHCR registries)'
        required: false
    outputs:
      image:
        description: 'Image reference tagged with the short SHA'
        value: ${{ jobs.container.outputs.image }}
      image_ref:
        description: 'Alias of image'
        value: ${{ jobs.container.outputs.image_ref }}
      image_repo:
        description: 'Image repository without tag'
        value: ${{ jobs.container.outputs.image_repo }}
      digest:
        description: 'Manifest-list digest'
        value: ${{ jobs.container.outputs.digest }}
      image_digest_ref:
        description: 'Immutable <repo>@sha256:... reference'
        value: ${{ jobs.container.outputs.image_digest_ref }}
      short_sha:
        description: '7-character commit SHA'
        value: ${{ jobs.container.outputs.short_sha }}

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test, deny, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: rust-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch koorikla/ci scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/ci}.git" "${CI_SHA:-v1}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Install pinned toolchain (rust-toolchain.toml)
        working-directory: ${{ inputs.working_directory }}
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working_directory }} -> target

      - name: Install cargo-nextest, cargo-deny, cargo-audit (prebuilt, checksummed)
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - name: fmt, clippy, test, cargo-deny, cargo-audit
        env:
          WORKDIR: ${{ inputs.working_directory }}
          RUN_FMT: ${{ inputs.run_fmt }}
          RUN_CLIPPY: ${{ inputs.run_clippy }}
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
          TEST_ARGS: ${{ inputs.test_args }}
          RUN_DENY: ${{ inputs.run_deny }}
          RUN_AUDIT: ${{ inputs.run_audit }}
          INSTALL_TOOLS: 'false'
        run: bash "$CI_SCRIPTS/rust/check.sh"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - name: Trivy fs scan of lockfiles
        id: fsscan
        env:
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          IGNORE_FILE: ${{ inputs.trivy_ignore_file }}
          SKIP_DIRS: "**/target"
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy fs SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-fs-rust-${{ inputs.working_directory }}

  codeql:
    name: CodeQL (rust)
    if: inputs.run_codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rust-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          source-root: ${{ inputs.working_directory }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:rust/${{ inputs.working_directory }}

  container:
    name: image
    needs: [test, codeql]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: $/.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
      trivy_ignore_file: ${{ inputs.trivy_ignore_file }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
