[project]
name = "ci-selftest-python"
version = "0.1.0"
description = "koorikla/ci selftest fixture: tiny WSGI service (python.yaml)"
requires-python = ">=3.13,<3.14"
dependencies = ["waitress>=3.0.2"]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ci_selftest_python"]
