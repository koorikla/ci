# Copy to .github/dependabot.yml
version: 2
updates:
  # Maven projects; use `gradle` for Gradle builds.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
